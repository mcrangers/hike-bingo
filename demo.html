<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta name="theme-color" content="#173e32">

  <title>How to play · Trail Bingo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f4ed;
      color: #173e32;
      font-family: system-ui, -apple-system, sans-serif;
    }

    main {
      max-width: 480px;
      margin: auto;
      padding: 25px 20px 40px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 35px;
    }

    header strong {
      font-size: 12px;
      letter-spacing: 3px;
    }

    a {
      color: inherit;
    }

    .exit {
      padding: 10px;
      font-size: 13px;
    }

    .pill {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 30px;
      background: #e1eadd;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    h1 {
      margin: 20px 0 15px;
      font-size: 36px;
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .sub {
      color: #647569;
      font-size: 15px;
      line-height: 1.7;
    }

    .panel {
      margin: 22px 0;
      padding: 22px;
      border: 1px solid #dbe1d6;
      border-radius: 20px;
      background: white;
    }

    button,
    .button {
      display: block;
      width: 100%;
      min-height: 50px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #173e32;
      color: white;
      font: inherit;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #c79c39;
      outline-offset: 4px;
    }

    .secondary {
      margin-top: 10px;
      background: #e1eadd;
      color: #173e32;
    }

    .quiet {
      margin-top: 20px;
      color: #647569;
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }

    .challenge {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 170px;
      padding: 20px;
      border: 2px solid #8caa83;
      border-radius: 16px;
      background: #f3f7ef;
      font-size: 25px;
      font-weight: 750;
      text-align: center;
    }

    .practice-challenge {
      margin-top: 14px;
    }

    .label {
      display: block;
      margin: 17px 0 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .field {
      padding: 13px;
      border: 1px solid #dbe1d6;
      border-radius: 10px;
      background: #f7f8f4;
      font-size: 15px;
    }

    .demo-label {
      color: #647569;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .signed {
      border-color: #6b8c5c;
      background: #e1eddb;
    }

    .signed small {
      display: block;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 500;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin: 20px 0;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      min-height: 0;
      padding: 4px;
      border-radius: 7px;
      background: #e8eee3;
      font-size: 10px;
    }

    .cell.demo-signed {
      background: #173e32;
      color: white;
    }

    .cell.free {
      background: #e5cf98;
      color: #59491e;
    }

    .rule {
      padding: 12px 0;
      border-bottom: 1px solid #e7eade;
      font-size: 14px;
      line-height: 1.7;
    }

    footer {
      margin-top: 24px;
      color: #647569;
      font-size: 11px;
      text-align: center;
    }

    [hidden] {
      display: none !important;
    }

    @media (prefers-reduced-motion: no-preference) {
      .signed {
        animation: pop 0.25s ease;
      }

      @keyframes pop {
        50% {
          transform: scale(1.025);
        }
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <strong>MC RANGERS</strong>

      <a class="exit" href="/hike-bingo/index.html">
        Exit demo
      </a>
    </header>

    <div id="content" aria-live="polite">
      <p class="sub">Loading the practice walkthrough…</p>
    </div>

    <noscript>
      <p class="sub">
        Please enable JavaScript to use the interactive demo.
      </p>

      <a class="button" href="/hike-bingo/index.html">
        Back to Trail Bingo
      </a>
    </noscript>

    <footer>
      DEMO ONLY · No real card is created or changed.
    </footer>
  </main>

    <script>
    (() => {
      "use strict";

      const container = document.getElementById("content");

      function showScreen(html) {
        container.innerHTML = html;
        window.scrollTo(0, 0);
      }

      function showChallenge() {
        showScreen(`
          <span class="pill">DEMO · 1 OF 3</span>

          <h1>Find someone who…</h1>

          <p class="sub">
            Each square is a reason to meet another hiker.
          </p>

          <div class="panel">
            <div class="challenge">
              Plays a musical instrument
            </div>

            <p class="sub">
              Find a hiker who matches this square.
              Then tap the square and let them sign.
            </p>
          </div>

          <button id="demo-next" type="button">
            Show me how →
          </button>

          <p class="quiet">
            Practice only. Your real board stays untouched.
          </p>
        `);

        document.getElementById("demo-next").onclick =
          showSigning;
      }

      function showSigning() {
        showScreen(`
          <span class="pill">DEMO · 2 OF 3</span>

          <h1>Let them sign.</h1>

          <p class="sub">
            We’ll use a fictional hiker called Alex
            for this practice square.
          </p>

          <div class="panel">
            <div class="demo-label">PRACTICE SQUARE</div>

            <div class="challenge practice-challenge">
              Plays a musical instrument
            </div>

            <div class="label">Demo person</div>
            <div class="field">Alex</div>

            <div class="label">College</div>
            <div class="field">Morningside</div>

            <p class="quiet">
              Fictional details. Nothing is saved.
            </p>
          </div>

          <button id="demo-sign" type="button">
            Sign practice square
          </button>

          <button
            id="demo-back"
            class="secondary"
            type="button"
          >
            ← Back
          </button>
        `);

        document.getElementById("demo-sign").onclick =
          showSigned;

        document.getElementById("demo-back").onclick =
          showChallenge;
      }

      function showSigned() {
        showScreen(`
          <span class="pill">DEMO · 2 OF 3</span>

          <h1>Square signed!</h1>

          <p class="sub">
            That’s one person met.
            Keep exploring and meeting new hikers.
          </p>

          <div class="panel">
            <div class="challenge signed">
              <div>
                Plays a musical instrument
                <small>Signed by Alex · Morningside</small>
              </div>
            </div>
          </div>

          <button id="demo-finish" type="button">
            What happens next? →
          </button>
        `);

        document.getElementById("demo-finish").onclick =
          showFinish;
      }

      function showFinish() {
        const squares = Array.from(
          { length: 25 },
          (_, index) => {
            if (index === 0) {
              return '<div class="cell demo-signed">Alex</div>';
            }

            if (index === 12) {
              return '<div class="cell free">FREE</div>';
            }

            return '<div class="cell"></div>';
          }
        ).join("");

        showScreen(`
          <span class="pill">DEMO · 3 OF 3</span>

          <h1>You’re ready.</h1>

          <p class="sub">
            Keep meeting hikers and filling your squares.
            This is only a sample board.
          </p>

          <div
            class="board"
            role="img"
            aria-label="Sample board with one signed square and a free centre"
          >
            ${squares}
          </div>

          <div class="panel">
            <div class="demo-label">ON HIKE DAY</div>

            <p class="sub">
              Open your real game when the organiser
              unlocks it. Check the instructions there
              for signing limits and the winning goal.
            </p>
          </div>

          <a
            class="button"
            href="/hike-bingo/index.html"
          >
            Back to Trail Bingo
          </a>

          <button
            id="demo-restart"
            class="secondary"
            type="button"
          >
            Try the demo again
          </button>

          <p class="quiet">
            No real card, signature or reward is created
            during this demo.
          </p>
        `);

        document.getElementById("demo-restart").onclick =
          showChallenge;
      }

      showChallenge();
    })();
  </script>
</body>
</html>
